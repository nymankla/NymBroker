name: CI

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)"
          test "${GITHUB_REF_NAME#v}" = "$version"
      # Builds the samples too; the test and pack steps below build only what they need.
      - run: dotnet build NymBroker.slnx --configuration Release -p:ContinuousIntegrationBuild=true
      - name: Publish and run Native AOT smoke app
        run: |
          dotnet publish samples/NymBroker.AotSample/NymBroker.AotSample.csproj --configuration Release --runtime linux-x64
          ./samples/NymBroker.AotSample/bin/Release/net10.0/linux-x64/publish/NymBroker.AotSample
      # Includes the code-health gate (CodeHealthTests, docs/architecture.md#code-health), which also writes its
      # summary of the worst methods to the job summary.
      - run: NYMBROKER_CODE_HEALTH_SUMMARY="$GITHUB_STEP_SUMMARY" dotnet test NymBroker.Tests/NymBroker.Tests.csproj --configuration Release -p:ContinuousIntegrationBuild=true
      - run: pwsh ./scripts/pack.ps1 -OutputDir artifacts/nupkg
      - run: test "$(find artifacts/nupkg -name '*.snupkg' | wc -l)" -eq 17
      - run: test -f artifacts/nymbroker-skills.zip
      - name: Upload packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            artifacts/nupkg
            artifacts/nymbroker-skills.zip
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    # Requires approval: configure required reviewers on the 'nuget' environment.
    environment: nuget
    permissions:
      id-token: write   # NuGet trusted publishing (OIDC)
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: artifacts
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      # Pushing a .nupkg also pushes the .snupkg next to it.
      - run: dotnet nuget push "artifacts/nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      # The skills zip keeps a fixed name, so .../releases/latest/download/nymbroker-skills.zip always points at the newest one.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/nymbroker-skills.zip --repo "$GITHUB_REPOSITORY" --title "NymBroker ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
