# Every image is pulled on each `docker compose up` (pull_policy: always), so the tags below always resolve to the
# newest release. Tags stay on the current major version, so existing data volumes keep working.
services:
  postgres:
    image: postgres:17
    pull_policy: always
    container_name: messagebroker-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nymbroker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    pull_policy: always
    container_name: messagebroker-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    pull_policy: always
    container_name: messagebroker-sqlserver
    # The image's entrypoint script runs as PID 1 and does not forward SIGTERM to sqlservr,
    # so `docker stop` would wait out the timeout and SIGKILL it. init: true adds a signal-forwarding init.
    init: true
    stop_grace_period: 30s
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Local development only. SQL Server requires 8+ chars from 3 of: upper, lower, digit, symbol.
      MSSQL_SA_PASSWORD: "NymBroker!Dev123"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  servicebus:
    # Azure Service Bus emulator (EULA: https://github.com/Azure/azure-service-bus-emulator-installer/blob/main/EMULATOR_EULA.txt).
    # Entities are declared in servicebus/Config.json; the emulator stores state in the sqlserver service above.
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    pull_policy: always
    container_name: messagebroker-servicebus
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      # AMQP is mapped to host port 5673 because RabbitMQ already uses 5672.
      - "5673:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: "NymBroker!Dev123"
      ACCEPT_EULA: "Y"
      EMULATOR_HTTP_PORT: 5300
    volumes:
      - ./servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro

  elasticmq:
    # SQS-compatible server for the AWS SQS endpoint. Queues are created by the tests and samples (no config file).
    image: softwaremill/elasticmq-native:latest
    pull_policy: always
    container_name: messagebroker-elasticmq
    ports:
      - "9324:9324"   # SQS API
      - "9325:9325"   # web UI

  mysql:
    image: mysql:8.4
    pull_policy: always
    container_name: messagebroker-mysql
    ports:
      - "3306:3306"
    environment:
      # Local development only.
      MYSQL_ROOT_PASSWORD: "NymBroker!Dev123"
      MYSQL_DATABASE: nymbroker
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # TCP, not the socket: during first-start initialisation the server only listens on the socket.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql_data:
  postgres_data:
  rabbitmq_data:
  sqlserver_data:
