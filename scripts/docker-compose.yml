services:
  postgres:
    image: postgres:17
    container_name: messagebroker-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nymbroker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: messagebroker-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: messagebroker-sqlserver
    # The image's entrypoint script runs as PID 1 and does not forward SIGTERM to sqlservr,
    # so `docker stop` would wait out the timeout and SIGKILL it. init: true adds a signal-forwarding init.
    init: true
    stop_grace_period: 30s
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Local development only. SQL Server requires 8+ chars from 3 of: upper, lower, digit, symbol.
      MSSQL_SA_PASSWORD: "NymBroker!Dev123"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  postgres_data:
  rabbitmq_data:
  sqlserver_data:
